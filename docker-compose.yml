services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: soundstash
      POSTGRES_PASSWORD: soundstash
      POSTGRES_DB: soundstash
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundstash"]
      interval: 5s
      timeout: 5s
      retries: 5
      # Postgres' first-boot initdb can take ~30s. Without a start_period the
      # healthcheck reaches its retry limit (~25s) and marks db unhealthy
      # mid-init, so `depends_on: condition: service_healthy` aborts the whole
      # `up` and tears the container down before initdb finishes — leaving a
      # half-initialized data dir (missing database, missing pg_hba rules).
      # The grace period lets the first init complete before checks count.
      start_period: 60s

  app:
    image: ghcr.io/cdeschenes/soundstash:main
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://soundstash:soundstash@db:5432/soundstash"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL}"
      MEDIA_ROOT: "/media"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      EMAIL_FROM: "${EMAIL_FROM:-SoundStash <noreply@localhost>}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    volumes:
      - ./media_data:/media

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8089:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./media_data:/media:ro

